name: 1. Crear Nuevo Cliente

on:
  workflow_dispatch:
    inputs:
      nombre_cliente:
        description: 'Nombre completo del nuevo cliente (Ej: Juan Perez)'
        required: true
      contacto:
        description: 'Detalle de contacto (Ej: juan.perez@email.com)'
        required: true
      servicio_inicial:
        description: 'Servicio solicitado inicialmente'
        required: true

jobs:
  notificar_creacion:
    runs-on: ubuntu-latest
    steps:
      - name: 💬 Notificación de Acción
        run: |
          CLIENTE="${{ github.event.inputs.nombre_cliente }}"
          CONTACTO="${{ github.event.inputs.contacto }}"
          SERVICIO="${{ github.event.inputs.servicio_inicial }}"
          
          # Mensaje de aviso para el equipo
          echo "::notice title=CLIENTE CREADO::[FLUJO 1] Un nuevo cliente ha sido registrado."
          echo "::notice title=CLIENTE CREADO::Nombre: $CLIENTE"
          echo "::notice title=CLIENTE CREADO::Contacto: $CONTACTO"
          echo "::notice title=CLIENTE CREADO::Servicio Inicial: $SERVICIO"
          echo "Todos los miembros del equipo han sido notificados de esta creación."
          
      - name: 💻 Simular Ejecución de Python
        # NOTA: Aquí iría la lógica real para llamar a tu clase ClienteManager.crear_cliente()
        run: |
          echo "Simulando ejecución de la función crear_cliente con los datos proporcionados..."
          echo "El archivo '$CLIENTE'.txt sería creado en el directorio 'datos_clientes'."