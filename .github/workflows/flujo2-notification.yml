name: 2. Actualizar Cliente Recurrente

on:
  workflow_dispatch:
    inputs:
      nombre_cliente:
        description: 'Nombre del cliente existente a actualizar'
        required: true
      nueva_solicitud:
        description: 'Detalle de la nueva solicitud o servicio'
        required: true

jobs:
  notificar_actualizacion:
    runs-on: ubuntu-latest
    steps:
      - name: 💬 Notificación de Acción
        run: |
          CLIENTE="${{ github.event.inputs.nombre_cliente }}"
          SOLICITUD="${{ github.event.inputs.nueva_solicitud }}"
          
          # Mensaje de aviso para el equipo
          echo "::notice title=CLIENTE ACTUALIZADO::[FLUJO 2] Se ha agregado una nueva solicitud al registro del cliente."
          echo "::notice title=CLIENTE ACTUALIZADO::Cliente: $CLIENTE"
          echo "::notice title=CLIENTE ACTUALIZADO::Nueva Solicitud: $SOLICITUD"
          echo "Todos los miembros del equipo han sido notificados de esta actualización."
          
      - name: 💻 Simular Ejecución de Python
        # NOTA: Aquí iría la lógica real para llamar a tu clase ClienteManager.actualizar_cliente()
        run: |
          echo "Simulando ejecución de la función actualizar_cliente con la nueva solicitud."
          echo "El archivo '$CLIENTE'.txt sería modificado."